name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tagName:
        description: "Release tag to create or update"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build Tauri app
        run: npm run tauri build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tagName || github.ref_name }}
          name: "PromptCraft ${{ github.event_name == 'workflow_dispatch' && inputs.tagName || github.ref_name }}"
          body: |
            PromptCraft Windows release.

            Highlights:
            - New OASIS framework based on OpenAI prompt guidance for outcome-first, evidence-aware prompts.
            - OpenAI-compatible API endpoint normalization for DeepSeek and OpenAI base URLs.
            - Responsive UI safeguards for long model names, API URLs, chat text, and framework labels.
            - Compact prompt context that sends only the selected framework guide plus recent chat history.

            Recommended download:
            - `PromptCraft_*_x64-setup.exe` for the standard Windows installer.
            - `PromptCraft_*_x64_en-US.msi` for MSI-based installation.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
